name: TikTok Video Generator

on:
  schedule:
    - cron: '0 20 * * *' # 定期実行
  workflow_dispatch:
    inputs:
      custom_theme:
        description: '【手動用】動画のテーマを入力（空欄ならリストからランダム）'
        required: false
        type: string
      custom_tone:
        description: '【手動用】動画の口調・雰囲気'
        required: false
        default: 'テンション高めの若者言葉'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-noto-cjk
        sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
    - name: Install Python Packages
      run: pip install google-generativeai edge-tts moviepy==1.0.3 requests
    - name: Run Video Generation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # GitHubの画面で入力された値を変数としてPythonに渡す
        CUSTOM_THEME: ${{ github.event.inputs.custom_theme }}
        CUSTOM_TONE: ${{ github.event.inputs.custom_tone }}
      run: python main.py
