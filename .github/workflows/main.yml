name: TikTok Video Generator

on:
  schedule:
    - cron: '0 20 * * *' # 日本時間の毎日朝5時に実行
  workflow_dispatch:
    inputs:
      custom_theme:
        description: '【手動用】動画のテーマを入力（空欄ならリストからランダム）'
        required: false
        type: string
      custom_tone:
        description: '【手動用】動画の口調・雰囲気'
        required: false
        default: 'テンション高めの若者言葉'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-noto-cjk
        POLICY_FILE=$(find /etc -name "policy.xml" | grep ImageMagick | head -n 1)
        if [ -n "$POLICY_FILE" ]; then
          echo "Found policy.xml at: $POLICY_FILE"
          sudo sed -i 's/none/read,write/g' "$POLICY_FILE"
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read,write" pattern="PDF"/g' "$POLICY_FILE"
        fi

    - name: Install Python Packages
      run: pip install -r requirements.txt

    - name: Run Video Generation Script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        CUSTOM_THEME: ${{ github.event.inputs.custom_theme }}
        CUSTOM_TONE: ${{ github.event.inputs.custom_tone }}
      run: python main.py

    - name: Upload Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-video
        path: final_video.mp4
